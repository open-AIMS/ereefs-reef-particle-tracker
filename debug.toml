# Example configuration for eReefs particle simulation (interim with both weeks & date_periods)
# Prefer date_periods; weeks retained temporarily for backward compatibility.
ids = ["18-096"]            # List of LABEL_ID reef identifiers "18-096"
years = [2016]                # Either [YEAR] or list e.g. [2015,2016]
# weeks = [3,4,5]             # (legacy) Ordinal weeks; leave commented when using date_periods
# Date periods use fixed 3-letter month + day (Jan01-Apr30). Multiple periods allowed.
date_periods = "Jan01-Jan01"
model_name = "gbr1_2.0"           # Short model identifier for naming
depth_m = -2.35               # Target depth (m, negative downward) used to choose nearest k
buffer_km = 10
# k_index = 40                  # Vertical index (zero-based)
data_root = "working/03-data"      # Directory containing extracted daily subcubes
traces_root = "C:/Temp/gis/ereefs-traces"         # Directory to save particle simulation traces
plots_root = "working/05-plots"
opendap_url = "https://thredds.nci.org.au/thredds/dodsC/fx3/model_data/gbr1_2.0.ncml"
# fnode_nc = "working/02/gbr1_fnodes.nc"  # Precomputed f-node grid
dt_hours = 0.1                # Integration timestep (hours)
runtime = 12                # Optional max runtime (hours)
overwrite = true             # Overwrite existing outputs if true
integrator = "rk4"            # rk4 or euler
shrink_margin = 1             # Interior margin for seeding
# log_file = "logs/run.log"   # Optional; omit for stdout only